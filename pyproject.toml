[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewayz"
version = "0.1.0"
description = "Python SDK for GatewayzApi - Auto-generated by docsalot from OpenAPI specification"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Organization", email = "support@example.com"}
]
maintainers = [
    {name = "Your Organization", email = "support@example.com"}
]
keywords = ["api", "sdk", "gatewayz", "docsalot", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.21.2",
    "pydantic>=2.0.0,<3.0.0",
    "typing-extensions>=4.0.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/gatewayz-python"
Documentation = "https://docs.example.com"
Repository = "https://github.com/yourusername/gatewayz-python"
"Bug Tracker" = "https://github.com/yourusername/gatewayz-python/issues"

[tool.setuptools]
# Map the current directory (.) to the package name 'gatewayz'
# This tells pip that when installing, treat . as the gatewayz package
package-dir = {"gatewayz" = "."}
# Explicitly list the package and its subpackages
packages = [
    "gatewayz",
    "gatewayz.core",
    "gatewayz.types",
    "gatewayz.errors",
    "gatewayz.activity",
    "gatewayz.admin",
    "gatewayz.authentication",
    "gatewayz.chat",
    "gatewayz.chat_history",
    "gatewayz.coupons",
    "gatewayz.debug",
    "gatewayz.models",
    "gatewayz.notifications",
    "gatewayz.plans",
    "gatewayz.providers",
    "gatewayz.ranking",
    "gatewayz.stripe_payments",
    "gatewayz.subscription",
    "gatewayz.trial",
]

[tool.setuptools.package-data]
"gatewayz" = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py37", "py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--strict-markers",
]

[tool.ruff]
line-length = 120
target-version = "py37"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
